<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 418" width="420" height="418" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Bank API statement flow">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5E78F0"/></marker></defs>
<rect width="420" height="418" fill="#FFFFFF"/>
<rect x="60" y="16" width="300" height="60" rx="10" fill="#3657EC" stroke="#3657EC" stroke-width="1.5"/><text x="210" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Your treasury system</text><text x="210" y="61" text-anchor="middle" font-size="12.5" fill="#E3E8FD">Signs and sends: "MT940, account X, date Y"</text><line x1="210" y1="78" x2="210" y2="118" stroke="#5E78F0" stroke-width="2" marker-end="url(#ah)"/><text x="222" y="102" text-anchor="start" font-size="12" font-style="italic" fill="#6B7280">Signed request</text><rect x="60" y="122" width="300" height="60" rx="10" fill="#EEF1FE" stroke="#C2B8FF" stroke-width="1.5"/><text x="210" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#16122C">Bank API</text><text x="210" y="167" text-anchor="middle" font-size="12.5" fill="#4B5563">Accepted, reference #123. Generating…</text><path d="M210 184 V200 H108 V226" fill="none" stroke="#5E78F0" stroke-width="2" marker-end="url(#ah)"/><path d="M210 200 H312 V226" fill="none" stroke="#5E78F0" stroke-width="2" marker-end="url(#ah)"/><rect x="16" y="230" width="184" height="66" rx="10" fill="#EEF1FE" stroke="#C2B8FF" stroke-width="1.5"/><text x="108" y="259" text-anchor="middle" font-size="15" font-weight="600" fill="#16122C">Option A: callback</text><text x="108" y="278" text-anchor="middle" font-size="12.5" fill="#4B5563">Bank calls your URL when ready</text><rect x="220" y="230" width="184" height="66" rx="10" fill="#EEF1FE" stroke="#C2B8FF" stroke-width="1.5"/><text x="312" y="259" text-anchor="middle" font-size="15" font-weight="600" fill="#16122C">Option B: second call</text><text x="312" y="278" text-anchor="middle" font-size="12.5" fill="#4B5563">You ask again after a set time</text><path d="M108 298 V316 H210" fill="none" stroke="#5E78F0" stroke-width="2"/><path d="M312 298 V316 H210 V338" fill="none" stroke="#5E78F0" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="342" width="300" height="60" rx="10" fill="#EEF1FE" stroke="#C2B8FF" stroke-width="1.5"/><text x="210" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#16122C">Statement received and loaded</text><text x="210" y="387" text-anchor="middle" font-size="12.5" fill="#4B5563">Matched to the request by its reference</text>
</svg>
